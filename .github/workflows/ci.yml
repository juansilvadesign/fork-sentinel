name: CI

on:
  push:
    branches: [main]
    paths: ["src/**", "test/**", "package.json", "tsconfig.json", ".github/workflows/ci.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Tests (offline)
        run: bun test
      - name: Typecheck
        run: bunx tsc --noEmit
