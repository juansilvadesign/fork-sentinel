<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>fork-sentinel — the funnel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

    @font-face{font-family:"InterVar";src:url("assets/fonts/inter-var.woff2")format("woff2");font-weight:100 900;font-display:block}
    @font-face{font-family:"JBMono";src:url("assets/fonts/jetbrains-mono-var.woff2")format("woff2");font-weight:100 800;font-display:block}

      *{margin:0;padding:0;box-sizing:border-box}
      :root{
  --bg:#0a0c10; --surface:#11151c; --surface2:#161b24; --line:#222936;
  --text:#e6e9ef; --muted:#8b94a7; --accent:#3fb950; --danger:#f85149; --amber:#d29922;
}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
      body{font-family:"InterVar",sans-serif;color:var(--text);
        background-image:radial-gradient(1400px 700px at 50% -240px,rgba(63,185,80,.10),transparent 70%)}
      .clip{position:absolute;inset:0}
      .mono{font-family:"JBMono",monospace;font-variant-ligatures:none}
      .c-dim{color:#808a9a} .c-red{color:var(--danger)} .c-green{color:var(--accent)}
      .c-white{color:#fff} .c-muted{color:var(--muted)}
      #cap{position:absolute;top:205px;left:0;right:0;display:flex;align-items:baseline;
        justify-content:center;gap:22px}
      #cap-n{font-size:118px;font-weight:800;letter-spacing:-.04em;line-height:1}
      #cap-t{font-size:40px;color:var(--muted)}
      #grid{position:absolute;left:50%;top:420px;transform:translateX(-50%);
        display:grid;grid-template-columns:repeat(12,110px);gap:16px}
      .tile{height:64px;border-radius:8px;background:var(--surface2);
        border:1px solid var(--line)}
      #colist{position:absolute;left:50%;top:400px;transform:translateX(-50%);
        width:1000px;display:flex;flex-direction:column;gap:18px;opacity:0}
      .co{display:flex;justify-content:space-between;align-items:center;
        background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--danger);
        border-radius:10px;padding:22px 30px}
      .co-n{font-size:34px;color:var(--text)}
      .co-b{font-size:34px;color:var(--danger)}
      #scene-end{opacity:0}
      #endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:22px;background:var(--bg)}
      #mark{font-size:96px;font-weight:800;letter-spacing:-.035em}
      #tag{font-size:38px;color:#c3cad6}
      #url{font-size:30px;color:var(--accent);margin-top:8px}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="funnel" data-start="0" data-duration="12"
         data-width="1920" data-height="1080" data-fps="30">
      <div class="clip" id="scene-grid" data-start="0" data-duration="12">
        <div id="cap"><span id="cap-n">69</span><span id="cap-t">forks</span></div>
        <div id="grid">
          <div class="tile t-b" id="k0"></div>
          <div class="tile t-b" id="k1"></div>
          <div class="tile t-m" id="k2"></div>
          <div class="tile t-b" id="k3"></div>
          <div class="tile t-b" id="k4"></div>
          <div class="tile t-d" id="k5"></div>
          <div class="tile t-b" id="k6"></div>
          <div class="tile t-b" id="k7"></div>
          <div class="tile t-b" id="k8"></div>
          <div class="tile t-m" id="k9"></div>
          <div class="tile t-b" id="k10"></div>
          <div class="tile t-b" id="k11"></div>
          <div class="tile t-b" id="k12"></div>
          <div class="tile t-b" id="k13"></div>
          <div class="tile t-d" id="k14"></div>
          <div class="tile t-b" id="k15"></div>
          <div class="tile t-b" id="k16"></div>
          <div class="tile t-m" id="k17"></div>
          <div class="tile t-b" id="k18"></div>
          <div class="tile t-b" id="k19"></div>
          <div class="tile t-b" id="k20"></div>
          <div class="tile t-d" id="k21"></div>
          <div class="tile t-b" id="k22"></div>
          <div class="tile t-b" id="k23"></div>
          <div class="tile t-b" id="k24"></div>
          <div class="tile t-b" id="k25"></div>
          <div class="tile t-m" id="k26"></div>
          <div class="tile t-b" id="k27"></div>
          <div class="tile t-b" id="k28"></div>
          <div class="tile t-b" id="k29"></div>
          <div class="tile t-d" id="k30"></div>
          <div class="tile t-b" id="k31"></div>
          <div class="tile t-b" id="k32"></div>
          <div class="tile t-m" id="k33"></div>
          <div class="tile t-b" id="k34"></div>
          <div class="tile t-b" id="k35"></div>
          <div class="tile t-b" id="k36"></div>
          <div class="tile t-b" id="k37"></div>
          <div class="tile t-d" id="k38"></div>
          <div class="tile t-b" id="k39"></div>
          <div class="tile t-b" id="k40"></div>
          <div class="tile t-m" id="k41"></div>
          <div class="tile t-b" id="k42"></div>
          <div class="tile t-b" id="k43"></div>
          <div class="tile t-b" id="k44"></div>
          <div class="tile t-b" id="k45"></div>
          <div class="tile t-b" id="k46"></div>
          <div class="tile t-d" id="k47"></div>
          <div class="tile t-b" id="k48"></div>
          <div class="tile t-b" id="k49"></div>
          <div class="tile t-b" id="k50"></div>
          <div class="tile t-b" id="k51"></div>
          <div class="tile t-m" id="k52"></div>
          <div class="tile t-b" id="k53"></div>
          <div class="tile t-b" id="k54"></div>
          <div class="tile t-b" id="k55"></div>
          <div class="tile t-d" id="k56"></div>
          <div class="tile t-b" id="k57"></div>
          <div class="tile t-b" id="k58"></div>
          <div class="tile t-b" id="k59"></div>
          <div class="tile t-m" id="k60"></div>
          <div class="tile t-b" id="k61"></div>
          <div class="tile t-b" id="k62"></div>
          <div class="tile t-b" id="k63"></div>
          <div class="tile t-d" id="k64"></div>
          <div class="tile t-b" id="k65"></div>
          <div class="tile t-b" id="k66"></div>
          <div class="tile t-b" id="k67"></div>
          <div class="tile t-d" id="k68"></div>
        </div>
        <div id="colist">
          <div class="co" id="co0"><span class="mono co-n">caveman</span><span class="mono co-b">309 behind</span></div>
          <div class="co" id="co1"><span class="mono co-n">Sink</span><span class="mono co-b">264 behind</span></div>
          <div class="co" id="co2"><span class="mono co-n">ai-website-cloner-template</span><span class="mono co-b">26 behind</span></div>
        </div>
      </div>
      <div class="clip" id="scene-end" data-start="9.5" data-duration="2.5">
        <div id="endcard">
          <div id="mark">&#9672; fork-sentinel</div>
          <div id="tag">Find the forks you actually maintain.</div>
          <div id="url" class="mono">juansilvadesign.github.io/fork-sentinel</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cap",{opacity:0,y:18},{opacity:1,y:0,duration:.5,ease:"power3.out"},0.15);
      tl.fromTo(".tile",{opacity:0,scale:.72},
        {opacity:1,scale:1,duration:.5,ease:"power2.out",stagger:{each:0.012,from:"start"}},0.35);

      // 69 -> 17: the bookmark majority recedes, it is never deleted from the frame.
      tl.to("#k0,#k1,#k3,#k4,#k6,#k7,#k8,#k10,#k11,#k12,#k13,#k15,#k16,#k18,#k19,#k20,#k22,#k23,#k24,#k25,#k27,#k28,#k29,#k31,#k32,#k34,#k35,#k36,#k37,#k39,#k40,#k42,#k43,#k44,#k45,#k46,#k48,#k49,#k50,#k51,#k53,#k54,#k55,#k57,#k58,#k59,#k61,#k62,#k63,#k65,#k66,#k67",{opacity:.10,scale:.86,duration:.6,ease:"power2.inOut",
        stagger:{each:0.004}},2.35);
      tl.to("#k2,#k5,#k9,#k14,#k17,#k21,#k26,#k30,#k33,#k38,#k41,#k47,#k52,#k56,#k60,#k64,#k68",{borderColor:"#3fb950",backgroundColor:"rgba(63,185,80,.16)",
        duration:.5,ease:"power2.out"},2.5);
      tl.to("#cap-n",{innerText:"17",duration:.35,snap:{innerText:1},ease:"none"},2.5);
      tl.to("#cap-t",{innerText:"carry your own commits",duration:.001},2.55);

      // 17 -> 9: only the ones upstream moved under.
      tl.to("#k2,#k9,#k17,#k26,#k33,#k41,#k52,#k60",{opacity:.16,scale:.88,borderColor:"#222936",
        backgroundColor:"#161b24",duration:.55,ease:"power2.inOut"},4.85);
      tl.to("#k5,#k14,#k21,#k30,#k38,#k47,#k56,#k64,#k68",{borderColor:"#f85149",backgroundColor:"rgba(248,81,73,.20)",
        duration:.5,ease:"power2.out"},5.0);
      tl.to("#cap-n",{innerText:"9",duration:.35,snap:{innerText:1},ease:"none"},5.0);
      tl.to("#cap-t",{innerText:"diverged \u2014 upstream moved",duration:.001},5.05);

      // Name the worst three, so the count stops being abstract.
      tl.to("#grid",{opacity:.14,duration:.55,ease:"power2.inOut"},7.15);
      tl.to("#colist",{opacity:1,duration:.4},7.25);
      tl.fromTo("#co0",{opacity:0,x:-26},{opacity:1,x:0,duration:.42,ease:"power3.out"},7.3);
      tl.fromTo("#co1",{opacity:0,x:-26},{opacity:1,x:0,duration:.42,ease:"power3.out"},7.55);
      tl.fromTo("#co2",{opacity:0,x:-26},{opacity:1,x:0,duration:.42,ease:"power3.out"},7.8);

      tl.to("#cap,#grid,#colist",{opacity:0,duration:.35,ease:"power2.inOut"},9.1);
      tl.to("#scene-end",{opacity:1,duration:.5,ease:"power2.out"},9.5);
      tl.fromTo("#mark",{opacity:0,y:22},{opacity:1,y:0,duration:.55,ease:"power3.out"},9.65);
      tl.fromTo("#tag",{opacity:0,y:16},{opacity:1,y:0,duration:.5,ease:"power3.out"},9.88);
      tl.fromTo("#url",{opacity:0},{opacity:1,duration:.5},10.1);
      window.__timelines["funnel"] = tl;
    </script>
  </body>
</html>
